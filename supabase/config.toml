# Supabase CLI config (local dev needs Docker). Owner: backend.
# Hosted project: `supabase link --project-ref <ref>` then `supabase db push`, then load supabase/seed.sql.
project_id = "sabaisafe"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = false
